name: Build and Release Echo

on:
  push:
    tags:
      - 'v*'
  # Disparo manual (aba Actions > Run workflow): cria a tag e o release a partir do commit escolhido.
  # A tag precisa bater com a versão do package.json (ex.: v0.40.2).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex.: v0.40.2)'
        required: true

permissions:
  contents: write

jobs:
  # Typecheck, lint e todos os testes. Se algo falhar, nada é publicado.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-release:
    needs: ci
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    # O disparo manual cria a tag, e isso dispara este workflow de novo (evento de tag).
    # As execuções da mesma tag rodam uma de cada vez, e a segunda não reconstrói o que já foi publicado.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "A tag $RELEASE_TAG não bate com a versão do package.json ($expected)." >&2
            exit 1
          fi

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"

      - name: Check if release is already published
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx 'latest.yml'; then
            echo "Release $RELEASE_TAG já publicado; nada a fazer."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      # Compila o instalador SEM publicar. Antes, compilar e publicar eram um passo só: a versão chegava aos
      # usuários sem que ninguém (nem nada) tivesse aberto o app instalado.
      - name: Build (sem publicar)
        if: steps.published.outputs.done != 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: npm run build && npx electron-builder --win --publish never

      # Instala o instalador recém-compilado, abre o Echo e confere que a tela carregou. Se o app não abrir,
      # a versão NÃO é publicada (scripts/smoke-test.mjs).
      - name: Teste de fumaça do app instalado
        if: steps.published.outputs.done != 'true'
        run: node scripts/smoke-test.mjs --installer-from dist-desktop

      # Publica exatamente os arquivos que foram testados. O latest.yml vai por último: é ele que faz os apps
      # instalados enxergarem a versão nova, então só sobe com o instalador já disponível.
      - name: Publicar
        if: steps.published.outputs.done != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          installer="Echo-Setup-$version.exe"
          cp "dist-desktop/Echo Setup $version.exe" "dist-desktop/$installer"
          cp "dist-desktop/Echo Setup $version.exe.blockmap" "dist-desktop/$installer.blockmap"
          if ! grep -q "url: $installer" dist-desktop/latest.yml; then
            echo "latest.yml não aponta para $installer:" >&2
            cat dist-desktop/latest.yml >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "dist-desktop/$installer" "dist-desktop/$installer.blockmap" --clobber
          gh release upload "$RELEASE_TAG" dist-desktop/latest.yml --clobber

