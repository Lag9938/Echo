name: CI

# Roda em todo push/PR e também é chamado pelo workflow de release (build-and-sign.yml),
# que só publica se todos os jobs daqui passarem.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Testes (vitest)
        run: npm test

  # Empacota o app como ele vai para os usuários e ABRE o resultado. Typecheck e testes rodam sobre o código;
  # só isto pega o que quebra no pacote (biblioteca faltando, preload quebrado, tela em branco).
  package:
    name: App empacotado (abre e carrega a tela)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Empacotar (sem instalador, sem publicar)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: npm run build && npx electron-builder --win dir --publish never

      - name: Teste de fumaça
        run: node scripts/smoke-test.mjs --app dist-desktop/win-unpacked/Echo.exe

  music-bot:
    name: Bot de música (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: music-bot/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes (node --test)
        run: npm test

  database:
    name: Banco (migrações no Postgres local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PGlite é um Postgres em memória: os testes não tocam no banco de produção.
      # Instalado só em supabase/ para não baixar as dependências do app (Electron etc.).
      - name: Instalar PGlite
        run: npm i --prefix supabase --no-save --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.8

      - name: Testes das migrações
        run: node supabase/tests/migrations.test.mjs
